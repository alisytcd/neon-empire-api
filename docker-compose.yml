services:
  db:
    image: postgres:16
    container_name: neon_empire_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - neon_empire_pgdata:/var/lib/postgresql/data

volumes:
  neon_empire_pgdata: